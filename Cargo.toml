[package]
name = "tms_provider"
version = "0.1.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private", "typed-header"] }
axum_responses = "0.5.5"
config = "0.15.25"
dirs = "6.0.0"
globwalk = "0.9.1"
indoc = "2.0.7"
jwtiny = "1.8.2"
moka = "0.12.15"
ordermap = "1.2.0"
reqwest = "0.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = { version = "1.0.150", features = ["default"] }
serde_merge = "0.1.3"
serde_with = { version = "3.21.0", features = ["chrono"] }
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
serde_yaml = "0.9.34"
uuid = { version = "1.23.4", features = ["v4"] }
toml = "1.1.2"
tracing-test = "0.2.6"
